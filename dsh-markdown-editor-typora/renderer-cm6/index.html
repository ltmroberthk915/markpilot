<!DOCTYPE html>
<html lang="zh-CN" data-dsh-embed="markpilot">

<head>
  <meta charset="utf-8" />
  <title>dsh-markdown-editor-typora · CM6 皮</title>
  <!-- 目录形状契约（ARCHITECTURE §4）：
       location.href = .../renderer-cm6/index.html
       currentScript = .../renderer-cm6/cm6/app.js
       Worker/mermaid/KaTeX 字体全部相对 cm6/ 解析 ⇒ 必须保持 index.html 在上一级。
       base 用 ./，保证引擎内部所有相对 URL 都落在本插件的 renderer-cm6/ 下。 -->
  <base href="./" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 安全边界：脚本只许同源；样式允许引擎用内联 <style>/style 属性注入调色板；
       图片放行 data/blob/https/http（Markdown 外链图）；字体同源。 -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; script-src 'self'; connect-src 'self' data: blob:; worker-src 'self' blob:" />
  <link rel="stylesheet" href="cm6/app.css" />
  <!-- 桥必须先于引擎加载：引擎在脚本尾部调用 window.handler.on(...) 注册下行处理。 -->
  <script src="dsh-bridge.js"></script>
  <!-- 选区浮按钮在 app.js 之后执行（defer 保证正文脚本先跑完）；它只读引擎 state，不改。 -->
  <script src="mp208-core.js"></script>
  <script src="dsh-selection.js" defer></script>
  <script src="dsh-interaction.js" defer></script>
  <!-- 数学推导 + AI 交互工具层（外壳）：defer 保证在 cm6/app.js 之后执行；
       只读 window.mpEngine._view()，写经 CM6 dispatch；不改引擎、不改桥；
       删掉本行 + dsh-mp-tools.js 即完全回退。 -->
  <script src="dsh-mp-tools.js" defer></script>
  <style>
    /* ── DSH 皮：只做三件事 ─────────────────────────────────────────────
       1) 给 iframe 一个不会白闪的首帧底色（引擎 boot 后由 --mp-bg 接管）；
       2) 选中浮按钮（dsh-selection.js 只加行为，样式归皮）；
       3) 轻提示（父窗口 toast 在引擎 toast 层不可用时的兜底）。
       纪律：不覆盖引擎的 html/body/.cm-editor 背景（引擎注入的 CSS 是后写者），
       不引入第二套文档/主题变量；明暗只跟随 <html data-dsh-theme>。 */
    /* 编辑区透明：让 DSH 应用背景（含 dream-skin 皮肤）直接透上来，消除与宿主之间的割裂感。
       引擎后注入的 html/body/.cm-editor 背景用 !important 压过（引擎不带 !important）。 */
    /* 透明模式：由独立 appearance 消息即时同步，load/ready/init 均可补发。 */
    html[data-mp-transparent="on"],
    html[data-mp-transparent="on"] body,
    html[data-mp-transparent="on"] .cm-editor,
    html[data-mp-transparent="on"] .cm-scroller,
    html[data-mp-transparent="on"] .cm-content,
    html[data-mp-transparent="on"] .cm-gutters,
    html[data-mp-transparent="on"] .mp-zoom-wrap {
      background: transparent !important;
    }

    /* Light ink needs a light translucent surface over a dark host wallpaper. */
    html[data-mp-transparent="on"][data-mode="light"],
    html[data-mp-transparent="on"][data-mp-reading="1"] {
      background: color-mix(in srgb,var(--mp-bg,#faf9f6) 86%,transparent) !important;
    }

    /* Keep the engine's page-width preference and zoom; compact only the shell inset. */
    html[data-dsh-embed="markpilot"]:not([data-mp-reading="1"]) .cm-scroller > .cm-content {
      --mp-measure: 100%;
      /* Native heading badges and code numbers use the leading gutter. */
      padding-left: 24px !important;
      padding-right: 8px !important;
    }
    /* Parent controls occupy physical x=12..44 and y=8..84. Island and content
       zoom are independent; reserve physical pixels through their own scales. */
    html[data-mp-workbench-collapsed="1"] .mp-toolbar {
      left: calc(56px / var(--mp-island-scale,1));
      max-width: calc(100% - 12px - 56px / var(--mp-island-scale,1));
    }
    html[data-mp-workbench-collapsed="1"]:not([data-mp-reading="1"]) .cm-content {
      padding-top: max(calc(var(--mp-toolbar-h,32px) + 2px),calc(88px / var(--mp-zoom,1))) !important;
    }

    html {
      background: #2E3440;
      color-scheme: dark;
    }

    html[data-mp-transparent="on"] {
      background: transparent;
    }

    @media (prefers-color-scheme: light) {
      html {
        color-scheme: light;
      }
    }

    html[data-dsh-theme="dark"] {
      color-scheme: dark;
    }

    html[data-dsh-theme="light"] {
      color-scheme: light;
    }

    /* 全屏编辑面（引擎 boot 会把 #editor 包进 .mp-zoom-wrap；两者都占满即可） */
    #editor {
      width: 100%;
      height: 100%;
    }

    /* ── 选中浮按钮 ───────────────────────────────────────────────────
       position:fixed + transform 定位；不参与引擎 .cm-editor 的 zoom 坐标系。
       默认 display:none，由 dsh-selection 的 data-on 切换；首帧不可见，零占用。 */
    #dsh-md-insert {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100000;
      display: none;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: #2b303a;
      color: #e9ecf1;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .32);
      font: 500 12.5px/1 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    #dsh-md-insert[data-on="1"] {
      display: inline-flex;
    }

    #dsh-md-insert:hover {
      border-color: rgba(120, 180, 255, .55);
      background: #333a47;
    }

    #dsh-md-insert:active {
      transform-origin: center;
      filter: brightness(.96);
    }

    #dsh-md-insert:focus-visible {
      outline: 2px solid #4c9aff;
      outline-offset: 2px;
    }

    #dsh-md-insert .dsh-md-insert-icon {
      font-size: 14px;
      line-height: 1;
      opacity: .9;
    }

    #dsh-md-insert[data-state="inserted"] {
      background: #1f6f43;
      border-color: rgba(74, 222, 128, .55);
      color: #eafff2;
    }

    html[data-dsh-theme="light"] #dsh-md-insert {
      background: #ffffff;
      color: #1f2328;
      border-color: rgba(16, 24, 40, .14);
      box-shadow: 0 6px 18px rgba(16, 24, 40, .16);
    }

    html[data-dsh-theme="light"] #dsh-md-insert:hover {
      background: #f3f5f8;
      border-color: rgba(16, 24, 40, .28);
    }

    html[data-dsh-theme="light"] #dsh-md-insert[data-state="inserted"] {
      background: #e8f7ee;
      border-color: rgba(16, 122, 66, .4);
      color: #146c3d;
    }

    #dsh-md-edit {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100000;
      display: none;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid rgba(120, 180, 255, .32);
      background: #232a36;
      color: #dbe8ff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .32);
      font: 500 12.5px/1 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    #dsh-md-edit[data-on="1"] {
      display: inline-flex;
    }

    #dsh-md-edit:hover {
      border-color: rgba(120, 180, 255, .7);
      background: #2b3547;
    }

    #dsh-md-edit:focus-visible {
      outline: 2px solid #4c9aff;
      outline-offset: 2px;
    }

    #dsh-md-edit[data-state="done"] {
      background: #1f5a46;
      border-color: rgba(74, 222, 128, .5);
      color: #eafff2;
    }

    html[data-dsh-theme="light"] #dsh-md-edit {
      background: #ffffff;
      color: #1f2328;
      border-color: rgba(16, 24, 40, .18);
      box-shadow: 0 6px 18px rgba(16, 24, 40, .16);
    }

    html[data-dsh-theme="light"] #dsh-md-edit:hover {
      background: #f3f5f8;
      border-color: rgba(16, 24, 40, .32);
    }

    #dsh-md-insert[data-state="done"] {
      background: #1f6f43;
      border-color: rgba(74, 222, 128, .55);
      color: #eafff2;
    }

    /* ── 轻提示 ───────────────────────────────────────────────────────
       只在引擎 mpExtras.toast 尚不可用时兜底；固定底部居中，2.6s 后自行隐去。 */
    #dsh-md-toast {
      position: fixed;
      left: 50%;
      bottom: 44px;
      z-index: 100001;
      display: none;
      max-width: min(80vw, 560px);
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(32, 36, 44, .96);
      color: #f2f4f7;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
      transform: translateX(-50%);
      pointer-events: none;
    }

    #dsh-md-toast[data-on="1"] {
      display: block;
    }

    html[data-dsh-theme="light"] #dsh-md-toast {
      background: rgba(255, 255, 255, .98);
      color: #1f2328;
      border: 1px solid rgba(16, 24, 40, .12);
      box-shadow: 0 8px 24px rgba(16, 24, 40, .18);
    }
    /* Plugin tools follow the active editor palette; no CM6 styles are changed. */
    html[data-dsh-theme] .mp-tools,
    html[data-dsh-theme] .mp-tools__btn,
    html[data-dsh-theme] .mp-tools__cell,
    html[data-dsh-theme] .mp-tools__ask input { color:var(--mp-fg,#c8cfda); }
    html[data-dsh-theme] .mp-tools__wand,
    html[data-dsh-theme] .mp-tools__panel {
      color:var(--mp-fg,#c8cfda);
      background:color-mix(in srgb,var(--mp-bg,#2e3440) 88%,transparent);
      border-color:var(--mp-border,rgba(128,128,128,.3));
    }
    html[data-dsh-theme] .mp-tools__h,
    html[data-dsh-theme] .mp-tools__cell small { color:var(--mp-muted,var(--mp-fg,#9aa4b2)); }
    html[data-dsh-theme] .mp-tools__cell,
    html[data-dsh-theme] .mp-tools__ask input {
      background:color-mix(in srgb,var(--mp-fg,#c8cfda) 5%,transparent);
      border-color:var(--mp-border,rgba(128,128,128,.3));
    }
    html[data-dsh-theme] .mp-tools__sep { background:var(--mp-border,rgba(128,128,128,.3)); }
    html[data-dsh-theme] .mp-tools__btn:hover,
    html[data-dsh-theme] .mp-tools__btn[data-on="1"],
    html[data-dsh-theme] .mp-tools__wand:hover,
    html[data-dsh-theme] .mp-tools__wand[data-on="1"],
    html[data-dsh-theme] .mp-tools__cell:hover,
    html[data-dsh-theme] .mp-tools__cell:active {
      color:var(--mp-fg,#c8cfda);
      background:color-mix(in srgb,var(--mp-accent,#4f8ef7) 20%,transparent);
    }
    html[data-dsh-theme="light"] .mp-tools__panel { box-shadow:0 12px 36px rgba(16,24,40,.16); }
    html[data-dsh-theme="light"] .mp-tools__toast { color:#146c3d;background:rgba(232,247,238,.96); }
  </style>
</head>

<body>
  <div id="editor"></div>
  <script src="cm6/app.js"></script>
</body>

</html>
