<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>md-editor test harness</title>
  <base href="/extension-src/render/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="cdn/vditor/dist/index.css" />
  <link rel="stylesheet" href="cdn/vditor/dist/css/content-theme/light.css" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="css/scrollbar.css" />
  <link rel="stylesheet" href="css/fontsize.css" />
  <script src="cdn/vditor/dist/index.min.js"></script>
  <script src="js/vscode.js"></script>
  <script>
    // stub render/js/vscode.js 提供的 webview↔宿主桥
    (() => {
      const events = {};
      const emitted = [];
      window.handler = {
        on(e, fn) { events[e] = fn; return this; },
        emit(e, d) { emitted.push({ e, d }); console.log("[emit]", e, d); },
      };
      window.__fire = (e, d) => events[e] && events[e](d);
      window.__emitted = emitted;
      // 固定明亮模式 + ir 模式，保证复现一致
      window.localStorage.setItem("dark", "false");
      window.localStorage.setItem("edit-mode", "ir");
      window.localStorage.setItem("outline", "false");
    })();
  </script>
</head>

<body>
  <div id="vditor"></div>
</body>
<script src="/extension-src/render/index.js" type="module"></script>
<script src="cdn/vditor/dist/js/icons/material.js"></script>
<script>
  // 装载计数（sessionStorage 跨重载保持），用于诊断页面是否被反复重载
  (() => {
    const n = (parseInt(sessionStorage.getItem("__loads") || "0", 10) + 1);
    sessionStorage.setItem("__loads", String(n));
    window.__loads = n;
  })();
</script>
<script>
  // 实时状态栏：显示光标/公式节点/文档状态（供自动化读取，绕过 evaluate 通道）
  (() => {
    const bar = document.createElement("div");
    bar.id = "__status";
    bar.style.cssText = "position:fixed;bottom:0;right:0;z-index:99999;background:#111;color:#0f0;font:11px monospace;padding:4px 8px;max-width:96vw;white-space:pre;";
    document.body.appendChild(bar);
    const path = (n) => {
      const parts = []; let e = n.nodeType === 3 ? n.parentElement : n;
      while (e && e.id !== "vditor") {
        if (e.tagName) {
          let s = e.tagName;
          if (e.className && typeof e.className === "string") s += "." + e.className.split(" ")[0];
          parts.unshift(s);
        }
        e = e.parentElement;
      }
      return parts.slice(-3).join(">");
    };
    const upd = () => {
      try {
        const sel = getSelection();
        let caret = "none", p = "-";
        if (sel.rangeCount) {
          const r = sel.getRangeAt(0); const c = r.startContainer;
          caret = (c.nodeName === "#text" ? "text@" : "el@") + r.startOffset;
          p = path(c);
        }
        const node = document.querySelector(".vditor-ir__node--expand[data-type='inline-node']")
          || document.querySelector(".vditor-ir__node[data-type='inline-node']");
        const code = node && node.querySelector("code");
        const ct = code ? code.textContent.substring(0, 20) : "-";
        const rootEl = document.querySelector(".vditor-ir .vditor-reset");
        const blocks = rootEl ? [...rootEl.children].map(c =>
          c.tagName + (c.textContent.trim() ? ":" + c.textContent.trim().substring(0, 6) : ":∅")).join("|") : "-";
        bar.textContent = "LOADS:" + (window.__loads || 0) + " CARET:" + caret + " PATH:" + p
          + " EXP:" + (node && node.className.includes("expand") ? 1 : 0)
          + " MK:" + (node ? node.querySelectorAll(":scope > .vditor-ir__marker").length : "-")
          + " BLK:" + blocks
          + " DBG:" + JSON.stringify(window.__typoraDebug || {})
          + " CODE:" + ct
          + " MD:" + (window.vditor ? window.vditor.getValue().replace(/\n/g, "⏎").substring(0, 70) : "-");
      } catch (e) { bar.textContent = "ERR:" + e.message; }
    };
    document.addEventListener("selectionchange", upd, true);
    document.addEventListener("click", () => setTimeout(upd, 60), true);
    document.addEventListener("keyup", () => setTimeout(upd, 60), true);
    document.addEventListener("input", () => setTimeout(upd, 200), true);
    setInterval(upd, 300);
  })();
</script>
<script>
  try {
    const styles = document.querySelectorAll('style')
    styles[0].remove()
    styles[1].remove()
  } catch (e) { }
</script>
<script>
  // index.js 模块加载并注册 open 事件后，注入测试文档
  const TEST_MD = window.__TEST_MD__ ||
    "# 一、集合运算法则\n\n数学测试：$\\Omega \\Omeg$ 与 $\\alpha+\\beta=\\gamma$\n";
  const waitVditor = setInterval(() => {
    if (window.__fire) {
      clearInterval(waitVditor);
      setTimeout(() => {
        window.__fire("open", {
          title: "test.md",
          content: TEST_MD,
          language: "zh-cn",
          scrollTop: 0,
          rootPath: ".",
        });
      }, 200);
    }
  }, 50);
</script>

<script src="/test/regression.js" type="module"></script>

</html>
